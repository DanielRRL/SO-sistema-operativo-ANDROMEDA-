<svg xmlns='http://www.w3.org/2000/svg' width='940' height='1340' viewBox='0 0 940 1340'><defs><marker id='ar' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#374151'/></marker></defs><rect width='940' height='1340' fill='white'/><text x='470.0' y='30' font-family='DejaVu Sans, Arial, sans-serif' font-size='22' text-anchor='middle' fill='#111827' font-weight="bold">Diagrama de flujo de la consola (version final)</text><ellipse cx='300' cy='60' rx='60' ry='22' fill='#e5e7eb' stroke='#374151' stroke-width='2'/><text x='300' y='65' font-family='DejaVu Sans, Arial, sans-serif' font-size='14' text-anchor='middle' fill='#111827' font-weight="bold">Inicio</text><text x='560' y='50' font-family='DejaVu Sans, Arial, sans-serif' font-size='12' text-anchor='start' fill='#6b7280'>Ctrl+C: avisa y sigue.  Ctrl+D: termina.</text><text x='560' y='68' font-family='DejaVu Sans, Arial, sans-serif' font-size='12' text-anchor='start' fill='#6b7280'>Con --script, la linea sale de un archivo</text><text x='560' y='86' font-family='DejaVu Sans, Arial, sans-serif' font-size='12' text-anchor='start' fill='#6b7280'>(se ignoran lineas vacias y con #).</text><rect x='140.0' y='110.0' width='320' height='50' rx='10' fill='#fef3c7' stroke='#b45309' stroke-width='2'/><text x='300.0' y='131.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='14' text-anchor='middle' fill='#111827' font-weight="bold">Leer una linea</text><text x='300.0' y='151.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' text-anchor='middle' fill='#374151'>prompt simulador&gt;</text><polygon points='300,200.0 410.0,235 300,270.0 190.0,235' fill='#fff7ed' stroke='#c2410c' stroke-width='2'/><text x='300' y='240' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' text-anchor='middle' fill='#111827' font-weight="bold">Linea vacia?</text><rect x='140.0' y='315.0' width='320' height='50' rx='10' fill='#ffffff' stroke='#374151' stroke-width='2'/><text x='300.0' y='336.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='14' text-anchor='middle' fill='#111827' font-weight="bold">tokenizar(linea) y parsear(tokens)</text><text x='300.0' y='356.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' text-anchor='middle' fill='#374151'>lexer.py (B) y parser.py (C)</text><polygon points='300,410.0 410.0,445 300,480.0 190.0,445' fill='#fff7ed' stroke='#c2410c' stroke-width='2'/><text x='300' y='450' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' text-anchor='middle' fill='#111827' font-weight="bold">Error de sintaxis?</text><polygon points='300,515.0 410.0,550 300,585.0 190.0,550' fill='#fff7ed' stroke='#c2410c' stroke-width='2'/><text x='300' y='555' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' text-anchor='middle' fill='#111827' font-weight="bold">Orden salir?</text><polygon points='300,620.0 410.0,655 300,690.0 190.0,655' fill='#fff7ed' stroke='#c2410c' stroke-width='2'/><text x='300' y='660' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' text-anchor='middle' fill='#111827' font-weight="bold">Orden limpiar?</text><polygon points='300,725.0 410.0,760 300,795.0 190.0,760' fill='#fff7ed' stroke='#c2410c' stroke-width='2'/><text x='300' y='765' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' text-anchor='middle' fill='#111827' font-weight="bold">Orden tokens?</text><rect x='140.0' y='845.0' width='320' height='50' rx='10' fill='#fef3c7' stroke='#b45309' stroke-width='2'/><text x='300.0' y='866.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='14' text-anchor='middle' fill='#111827' font-weight="bold">consola.despachar(orden)</text><text x='300.0' y='886.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' text-anchor='middle' fill='#374151'>elige el modulo segun el comando</text><rect x='110.0' y='935.0' width='380' height='60' rx='10' fill='#ffffff' stroke='#374151' stroke-width='2'/><text x='300.0' y='957.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='14' text-anchor='middle' fill='#111827' font-weight="bold">El modulo ejecuta la accion</text><text x='300.0' y='977.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' text-anchor='middle' fill='#374151'>procesos, planificador, estadisticas, memoria,</text><text x='300.0' y='991.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' text-anchor='middle' fill='#374151'>archivos, hilos_sync, mensajes</text><rect x='120.0' y='1035.0' width='360' height='50' rx='10' fill='#ffffff' stroke='#374151' stroke-width='2'/><text x='300.0' y='1065.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='14' text-anchor='middle' fill='#111827' font-weight="bold">Imprimir [OK] o [ERROR] + explicacion</text><path d='M300,82 L300,110' fill='none' stroke='#374151' stroke-width='2' marker-end='url(#ar)'/><path d='M300,160 L300,200' fill='none' stroke='#374151' stroke-width='2' marker-end='url(#ar)'/><path d='M300,270 L300,315' fill='none' stroke='#374151' stroke-width='2' marker-end='url(#ar)'/><path d='M300,365 L300,410' fill='none' stroke='#374151' stroke-width='2' marker-end='url(#ar)'/><path d='M300,480 L300,515' fill='none' stroke='#374151' stroke-width='2' marker-end='url(#ar)'/><path d='M300,585 L300,620' fill='none' stroke='#374151' stroke-width='2' marker-end='url(#ar)'/><path d='M300,690 L300,725' fill='none' stroke='#374151' stroke-width='2' marker-end='url(#ar)'/><path d='M300,795 L300,845' fill='none' stroke='#374151' stroke-width='2' marker-end='url(#ar)'/><path d='M300,895 L300,935' fill='none' stroke='#374151' stroke-width='2' marker-end='url(#ar)'/><path d='M300,995 L300,1035' fill='none' stroke='#374151' stroke-width='2' marker-end='url(#ar)'/><text x='312' y='286' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' text-anchor='start' fill='#c2410c' font-weight="bold">no</text><text x='312' y='496' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' text-anchor='start' 